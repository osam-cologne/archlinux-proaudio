# Hugo static site generator config
---
params:
  bannerImage: https://github.com/user-attachments/assets/a9ec7f4e-95b6-4b56-8c53-a1c111242c0a
  repoUrl: https://arch.osamc.de/proaudio/%s/%s
  pkgbuildUrl: https://github.com/osam-cologne/archlinux-proaudio/blob/master/packages/%s/PKGBUILD
  maxWidth: 1000

baseURL: https://arch.osamc.de/
languageCode: en-us
title: Arch Linux Pro-Audio Binary Repo
publishDir: .tmp/public
resourceDir: .tmp/resources
module:
  mounts:
    - source: web/content
      target: content
    - source: web/static
      target: static
    - source: web/layouts
      target: layouts
    - source: web/data
      target: data
    - source: web/assets
      target: assets
    - source: web/i18n
      target: i18n
    - source: web/archetypes
      target: archetypes
minify:
  minifyOutput: true
